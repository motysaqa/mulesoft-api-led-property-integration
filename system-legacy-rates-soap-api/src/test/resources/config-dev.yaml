# Test-scope configuration. Committed on purpose: it contains no secrets and
# MUnit needs config-dev.yaml on the classpath to start the app under test.
http:
  host: "0.0.0.0"
  port: "8082"
  basePath: "/api/v1"

rates:
  soap:
    # WSDL is packaged with the app so the connector does not need network access at start-up.
    wsdlLocation: "wsdl/LegacyRatesService.wsdl"
    service: "LegacyRatesService"
    port: "LegacyRatesPort"
    address: "http://localhost:5082/LegacyRatesService"
    responseTimeoutMs: "8000"

resilience:
  retry:
    maxAttempts: "3"
    initialBackoffMs: "500"
